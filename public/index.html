<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Dibuja Ya!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a0a2e;
    --bg2: #251749;
    --accent: #ff6b35;
    --accent2: #ffd166;
    --green: #06d6a0;
    --pink: #ef476f;
    --blue: #118ab2;
    --purple: #7b2ff7;
    --card: rgba(255,255,255,0.08);
    --card-border: rgba(255,255,255,0.12);
    --text: #fff;
    --text-dim: rgba(255,255,255,0.6);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, #16213e 100%);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; align-items: center; min-height: 100dvh; padding: 16px; }
  .screen.active { display: flex; }

  /* ===== LOBBY ===== */
  #lobby { justify-content: center; gap: 20px; text-align: center; }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 4px 12px rgba(255,107,53,0.4));
    animation: logoFloat 3s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo-emoji { font-size: clamp(2.8rem, 9vw, 4rem); display: block; margin-bottom: 4px; }

  .subtitle {
    font-size: 0.95rem; color: var(--text-dim); margin-top: -8px;
    font-weight: 600;
  }

  .lobby-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    width: 100%; max-width: 380px;
    backdrop-filter: blur(20px);
  }

  .input-group { margin-bottom: 14px; }

  .input-group label {
    display: block; font-size: 0.8rem; font-weight: 700;
    color: var(--text-dim); margin-bottom: 6px; text-align: left;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .input-group input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 2px solid var(--card-border); background: rgba(255,255,255,0.06);
    color: var(--text); font-size: 1.05rem; font-family: 'Nunito', sans-serif;
    font-weight: 700; outline: none; transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: rgba(255,255,255,0.3); }

  .code-input { text-align: center; letter-spacing: 8px; font-size: 1.5rem !important; text-transform: uppercase; }

  .btn-row { display: flex; gap: 10px; margin-top: 6px; }

  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 14px;
    font-family: 'Fredoka One', cursive; font-size: 1.05rem;
    cursor: pointer; transition: all 0.2s; color: #fff;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.96); }

  .btn-create {
    background: linear-gradient(135deg, var(--accent), #ff8c42);
    box-shadow: 0 4px 16px rgba(255,107,53,0.4);
  }
  .btn-join {
    background: linear-gradient(135deg, var(--purple), #9b59b6);
    box-shadow: 0 4px 16px rgba(123,47,247,0.4);
  }

  .divider {
    display: flex; align-items: center; gap: 12px; margin: 8px 0;
    color: var(--text-dim); font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: var(--card-border);
  }


  .toggle-join {
    background: none; border: none; color: var(--accent2);
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 0.95rem; cursor: pointer; padding: 8px;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .error-msg {
    background: rgba(239,71,111,0.2); border: 1px solid var(--pink);
    color: var(--pink); padding: 10px 14px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 700; margin-top: 8px; display: none;
  }

  /* ===== WAITING ===== */
  #waiting { justify-content: center; gap: 24px; text-align: center; }

  .room-code-display {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.8rem, 10vw, 4.5rem);
    letter-spacing: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: codePulse 2s ease-in-out infinite;
  }
  @keyframes codePulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.7; }
  }

  .waiting-text { color: var(--text-dim); font-weight: 700; }

  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--card-border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-copy {
    background: linear-gradient(135deg, var(--green), #0eb88a);
    padding: 12px 28px; border: none; border-radius: 12px;
    color: #fff; font-family: 'Fredoka One', cursive;
    font-size: 0.95rem; cursor: pointer;
  }

  /* ===== GAME SCREEN ===== */
  #game {
    padding: 0; gap: 0; min-height: 100dvh;
    justify-content: flex-start;
  }

  .game-header {
    width: 100%; padding: 10px 14px;
    background: rgba(0,0,0,0.3);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0; gap: 8px;
  }

  .round-badge {
    background: var(--purple); padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 800; white-space: nowrap;
  }

  .timer-badge {
    font-family: 'Fredoka One', cursive; font-size: 1.3rem;
    min-width: 48px; text-align: center;
  }
  .timer-badge.urgent { color: var(--pink); animation: timerPulse 0.5s ease-in-out infinite; }
  @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .scores-mini {
    display: flex; gap: 6px; font-size: 0.75rem; font-weight: 800;
  }
  .score-pill {
    padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.1);
  }
  .score-pill.drawing { background: var(--accent); }

  .word-display {
    width: 100%; text-align: center; padding: 8px 14px;
    background: rgba(255,255,255,0.05); flex-shrink: 0;
  }
  .word-hint {
    font-family: 'Fredoka One', cursive; font-size: 1.5rem;
    letter-spacing: 6px; color: var(--accent2);
  }
  .word-role {
    font-size: 0.75rem; color: var(--text-dim); font-weight: 700;
    margin-bottom: 2px;
  }

  /* Canvas area */
  .canvas-area {
    flex: 1; width: 100%; display: flex; flex-direction: column;
    min-height: 0; position: relative;
    background: #fff; overflow: hidden;
  }

  canvas {
    width: 100%; flex: 1; cursor: crosshair;
    touch-action: none;
    display: block;
  }

  /* Drawing tools */
  .tools {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: rgba(0,0,0,0.85);
    overflow-x: auto; flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }

  .color-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer;
    flex-shrink: 0; transition: all 0.15s;
  }
  .color-btn.active { border-color: #fff; transform: scale(1.15); }

  .tool-btn {
    padding: 6px 12px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff; font-size: 0.8rem; font-weight: 800;
    font-family: 'Nunito', sans-serif;
    cursor: pointer; flex-shrink: 0;
    white-space: nowrap;
  }
  .tool-btn.active { border-color: var(--accent); background: rgba(255,107,53,0.3); }

  .thickness-slider {
    width: 70px; accent-color: var(--accent); flex-shrink: 0;
  }

  .tools-disabled { pointer-events: none; opacity: 0.3; }

  /* Chat / guess area */
  .chat-area {
    width: 100%; flex-shrink: 0;
    background: rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
  }

  .chat-messages {
    max-height: 100px; overflow-y: auto;
    padding: 6px 12px; font-size: 0.85rem;
    display: flex; flex-direction: column; gap: 2px;
  }

  .chat-msg { line-height: 1.4; }
  .chat-msg .name { font-weight: 800; color: var(--accent2); }
  .chat-msg.system {
    color: var(--green); font-weight: 700;
    text-align: center; font-size: 0.8rem;
  }
  .chat-msg.wrong .name { color: var(--text-dim); }

  .chat-input-row {
    display: flex; gap: 8px; padding: 8px 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .chat-input-row input {
    flex: 1; padding: 12px 14px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: #fff; font-size: 1rem; font-family: 'Nunito', sans-serif;
    font-weight: 700; outline: none;
  }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-input-row input::placeholder { color: rgba(255,255,255,0.3); }

  .btn-send {
    padding: 12px 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--green), #0eb88a);
    color: #fff; font-family: 'Fredoka One', cursive;
    font-size: 0.95rem; cursor: pointer;
  }

  /* ===== ROUND OVERLAY ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center;
    z-index: 100; padding: 20px;
  }
  .overlay.active { display: flex; }

  .overlay-card {
    background: var(--bg2); border: 2px solid var(--card-border);
    border-radius: 24px; padding: 32px; text-align: center;
    max-width: 360px; width: 100%;
    animation: overlayPop 0.3s ease-out;
  }
  @keyframes overlayPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .overlay-emoji { font-size: 3.5rem; margin-bottom: 12px; }

  .overlay-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem; margin-bottom: 8px;
  }
  .overlay-title.correct { color: var(--green); }
  .overlay-title.timeout { color: var(--pink); }

  .overlay-word {
    font-size: 1.2rem; color: var(--accent2);
    font-weight: 800; margin-bottom: 16px;
  }

  .overlay-scores {
    display: flex; justify-content: center; gap: 20px; margin-top: 12px;
  }

  .overlay-score-item {
    text-align: center;
  }
  .overlay-score-name { font-size: 0.85rem; color: var(--text-dim); font-weight: 700; }
  .overlay-score-pts {
    font-family: 'Fredoka One', cursive; font-size: 1.8rem;
    color: var(--accent2);
  }

  /* ===== GAME OVER ===== */
  #gameOver { justify-content: center; gap: 20px; text-align: center; }

  .trophy { font-size: 5rem; animation: trophyBounce 1s ease-in-out infinite; }
  @keyframes trophyBounce {
    0%,100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-12px) rotate(-5deg); }
    75% { transform: translateY(-12px) rotate(5deg); }
  }

  .winner-name {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 6vw, 2.5rem);
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .final-scores {
    display: flex; gap: 24px; justify-content: center;
  }

  .final-score-card {
    background: var(--card); border: 2px solid var(--card-border);
    border-radius: 20px; padding: 20px 28px; text-align: center;
  }
  .final-score-card.winner { border-color: var(--accent2); }

  .final-score-name { font-weight: 800; font-size: 1rem; margin-bottom: 4px; }
  .final-score-pts {
    font-family: 'Fredoka One', cursive; font-size: 2.2rem;
    color: var(--accent2);
  }

  .btn-play-again {
    background: linear-gradient(135deg, var(--accent), #ff8c42);
    padding: 14px 36px; border: none; border-radius: 14px;
    color: #fff; font-family: 'Fredoka One', cursive;
    font-size: 1.1rem; cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    margin-top: 8px;
  }

  /* ===== CONFETTI ===== */
  .confetti-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden;
  }
  .confetti-piece {
    position: absolute; width: 10px; height: 10px;
    top: -20px; animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { top: 110vh; transform: rotate(720deg); }
  }
  #game { max-width: 1050px; margin-inline: auto; }
  .game-header { flex-wrap: wrap; }
  .scores-mini { flex-wrap: wrap; overflow-wrap: anywhere; }
  .canvas-area { flex: none; height: clamp(180px, 42dvh, 480px); }
  .tools { width: 100%; }
  .tools > * { flex-shrink: 0; }
  .chat-area { padding-bottom: env(safe-area-inset-bottom); }
  .chat-input-row input { min-width: 0; }
  .chat-msg { overflow-wrap: anywhere; }
  .word-hint { overflow-wrap: anywhere; }
  .game-action {
    min-height: 44px; padding: 7px 11px; border: 0; border-radius: 10px;
    background: #43375d; color: white; font: inherit; cursor: pointer;
  }
  .game-action:disabled { opacity: 0.55; }
  .extras, .chat-picker {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px;
  }
  .chat-picker[hidden], .chat-input-row[hidden] { display: none; }
  .chat-picker { max-height: 170px; overflow: auto; }
  .meme-image { display: block; width: min(180px, 100%); border-radius: 8px; }
  .meme-choice img { display: block; width: 66px; height: 50px; object-fit: cover; }
  #hintText { color: var(--accent2); margin: 4px 0; }
  #connectionStatus { position: fixed; top: 8px; right: 8px; z-index: 20; background: #43375d; padding: 8px 12px; border-radius: 8px; }
  #connectionStatus:empty { display: none; }
  @media (max-width: 480px) {
    .game-header, .chat-input-row { padding-inline: 8px; }
    .chat-input-row { gap: 5px; }
    .chat-input-row input { padding-inline: 8px; }
    .btn-send { padding-inline: 12px; }
    .word-hint { font-size: 1.2rem; letter-spacing: 3px; }
    .chat-messages { min-height: 48px; max-height: 105px; }
  }
</style>
<link rel="stylesheet" href="/games.css">
</head>
<body>
<div id="connectionStatus" role="status"></div>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <span class="logo-emoji">🎨</span>
  <h1 class="logo">Dibuja Ya!</h1>
  <p class="subtitle">Dibuja, adivina y diviértete con amigos</p>

  <div class="lobby-card">
    <div class="input-group">
      <label>Tu nombre</label>
      <input type="text" id="nameInput" placeholder="Escribe tu nombre..." maxlength="15" autocomplete="off">
    </div>

    <button class="btn btn-create" id="btnCreate" onclick="createRoom()">🎮 Crear Sala</button>

    <div class="divider">o</div>

    <button class="toggle-join" onclick="toggleJoin()">Tengo un código para unirme ➜</button>

    <div id="joinSection" hidden>
      <div class="input-group">
        <label>Código de sala</label>
        <input type="text" id="codeInput" class="code-input" placeholder="ABCD" maxlength="4" autocomplete="off">
      </div>
      <button class="btn btn-join" id="btnJoin" onclick="joinRoom()">🚀 Unirme</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- WAITING ROOM -->
<div id="waiting" class="screen">
  <span class="logo-emoji">⏳</span>
  <p class="waiting-text">Comparte este código con tu amigo:</p>
  <div class="room-code-display" id="roomCodeDisplay">----</div>
  <button class="btn-copy" onclick="copyCode()">📋 Copiar código</button>
  <div class="spinner"></div>
  <p class="waiting-text">Esperando al otro jugador...</p>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="game-header">
    <span class="round-badge" id="roundBadge">Ronda 1/10</span>
    <span class="timer-badge" id="timerBadge">60</span>
    <div class="scores-mini" id="scoresMini"></div>
    <button type="button" class="game-action" id="musicToggle" aria-pressed="false">🎵 Música</button>
    <button type="button" class="game-action" id="gamesBack">Juegos</button>
  </div>

  <div class="word-display">
    <div class="word-role" id="wordRole"></div>
    <div class="word-hint" id="wordHint"></div>
    <p id="hintText" role="status" hidden></p>
  </div>

  <div class="canvas-area">
    <canvas id="canvas"></canvas>
  </div>

  <div class="tools" id="toolsBar">
    <!-- Colors filled by JS -->
  </div>

  <section id="gameHub" hidden></section>
  <div class="chat-area" id="chatArea">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row" id="chatInputRow">
      <input type="text" id="guessInput" aria-label="Respuesta" placeholder="Adivina el dibujo..." maxlength="60" autocomplete="off">
      <button class="game-action" id="hintButton" type="button">💡 Pista</button>
      <button class="btn-send" onclick="sendGuess()">Adivinar</button>
    </div>
    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" aria-label="Mensaje de chat" placeholder="Escribe al chat..." maxlength="250" autocomplete="off">
      <button type="button" class="game-action" id="emojiToggle" aria-label="Emojis" aria-expanded="false">😀</button>
      <button type="button" class="game-action" id="memeToggle" aria-expanded="false">Memes</button>
      <button class="btn-send" type="submit" aria-label="Enviar mensaje">➤</button>
    </form>
    <div class="chat-picker" id="chatPicker" hidden></div>
  </div>
</div>

<!-- ROUND OVERLAY -->
<div class="overlay" id="roundOverlay">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <div class="overlay-title" id="overlayTitle">¡Correcto!</div>
    <div class="overlay-word" id="overlayWord"></div>
    <div class="overlay-scores" id="overlayScores"></div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen">
  <div class="trophy">🏆</div>
  <div class="winner-name" id="winnerName">¡Ganador!</div>
  <div class="final-scores" id="finalScores"></div>
  <button class="btn-play-again" onclick="socket.emit('gamesMenu')">Volver a los juegos</button>
</div>

<!-- CONFETTI -->
<div class="confetti-container" id="confettiContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// --- State ---
let myRole = null;    // 'drawer' | 'guesser'
let isDrawing = false;
let lastPos = null;
let currentColor = '#1a1a2e';
let brushSize = 5;
let isEraser = false;
let myRoomCode = '';

// --- DOM refs ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Screen management ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'game') resizeCanvas();
}

// --- Lobby ---
function toggleJoin() {
  const section = document.getElementById('joinSection');
  section.hidden = !section.hidden;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function createRoom() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return showError('Escribe tu nombre');

  document.getElementById('btnCreate').disabled = true;
  socket.emit('createRoom', name, (res) => {
    document.getElementById('btnCreate').disabled = false;
    if (res.success) {
      myRoomCode = res.code;
      document.getElementById('roomCodeDisplay').textContent = res.code;
      showScreen('waiting');
    } else {
      showError(res.error);
    }
  });
}

function joinRoom() {
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!name) return showError('Escribe tu nombre');
  if (code.length !== 4) return showError('El código debe tener 4 letras');

  document.getElementById('btnJoin').disabled = true;
  socket.emit('joinRoom', { code, name }, (res) => {
    document.getElementById('btnJoin').disabled = false;
    if (res.success) {
      myRoomCode = res.code;
      document.getElementById('roomCodeDisplay').textContent = res.code;
      showScreen('waiting');
    } else {
      showError(res.error);
    }
  });
}

function copyCode() {
  navigator.clipboard.writeText(myRoomCode).catch(() => {});
  const btn = document.querySelector('.btn-copy');
  btn.textContent = '✅ ¡Copiado!';
  setTimeout(() => btn.textContent = '📋 Copiar código', 1500);
}

// --- Canvas ---
function resizeCanvas() {
  const area = document.querySelector('.canvas-area');
  const rect = area.getBoundingClientRect();
  const width = Math.round(rect.width * 2);
  const height = Math.round(rect.height * 2);
  if (!width || !height || (canvas.width === width && canvas.height === height)) return;
  const previous = document.createElement('canvas');
  previous.width = canvas.width;
  previous.height = canvas.height;
  previous.getContext('2d').drawImage(canvas, 0, 0);
  canvas.width = width;
  canvas.height = height;
  ctx.scale(2, 2);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(previous, 0, 0, width / 2, height / 2);
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) / rect.width,
    y: (touch.clientY - rect.top) / rect.height
  };
}

function drawLine(from, to, color, size) {
  const w = canvas.width / 2;
  const h = canvas.height / 2;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = size;
  ctx.moveTo(from.x * w, from.y * h);
  ctx.lineTo(to.x * w, to.y * h);
  ctx.stroke();
}

function drawDot(pos, color, size) {
  const w = canvas.width / 2;
  const h = canvas.height / 2;
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(pos.x * w, pos.y * h, size / 2, 0, Math.PI * 2);
  ctx.fill();
}

// Pointer events (unified mouse+touch)
canvas.addEventListener('pointerdown', (e) => {
  if (myRole !== 'drawer') return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  lastPos = getCanvasPos(e);
  const c = isEraser ? '#ffffff' : currentColor;
  const s = isEraser ? brushSize * 3 : brushSize;
  drawDot(lastPos, c, s);
  socket.emit('draw', { type: 'dot', pos: lastPos, color: c, size: s });
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDrawing || myRole !== 'drawer') return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  const c = isEraser ? '#ffffff' : currentColor;
  const s = isEraser ? brushSize * 3 : brushSize;
  drawLine(lastPos, pos, c, s);
  socket.emit('draw', { type: 'line', from: lastPos, to: pos, color: c, size: s });
  lastPos = pos;
});

canvas.addEventListener('pointerup', () => { isDrawing = false; lastPos = null; });
canvas.addEventListener('pointercancel', () => { isDrawing = false; lastPos = null; });

// Receive drawing
socket.on('draw', (data) => {
  if (data.type === 'dot') drawDot(data.pos, data.color, data.size);
  else drawLine(data.from, data.to, data.color, data.size);
});

socket.on('clearCanvas', () => {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width / 2, canvas.height / 2);
});

// --- Tools ---
const COLORS = [
  '#1a1a2e', '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71',
  '#1abc9c', '#3498db', '#9b59b6', '#e84393', '#6c5ce7',
  '#fd79a8', '#00b894', '#fdcb6e', '#636e72', '#dfe6e9'
];

function setupTools() {
  const bar = document.getElementById('toolsBar');
  bar.innerHTML = '';

  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (i === 0 ? ' active' : '');
    btn.style.background = c;
    btn.onclick = () => {
      isEraser = false;
      currentColor = c;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('eraserBtn')?.classList.remove('active');
    };
    bar.appendChild(btn);
  });

  // Eraser
  const eraser = document.createElement('button');
  eraser.className = 'tool-btn';
  eraser.id = 'eraserBtn';
  eraser.textContent = '🧹';
  eraser.onclick = () => {
    isEraser = !isEraser;
    eraser.classList.toggle('active', isEraser);
    if (isEraser) document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    else {
      document.querySelector('.color-btn').classList.add('active');
      currentColor = COLORS[0];
    }
  };
  bar.appendChild(eraser);

  // Thickness
  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = 2; slider.max = 20; slider.value = 5;
  slider.className = 'thickness-slider';
  slider.oninput = () => brushSize = parseInt(slider.value);
  bar.appendChild(slider);

  // Clear
  const clear = document.createElement('button');
  clear.className = 'tool-btn';
  clear.textContent = '🗑️';
  clear.onclick = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width / 2, canvas.height / 2);
    socket.emit('clearCanvas');
  };
  bar.appendChild(clear);
}
setupTools();

// --- Chat ---
function addChatMsg(name, text, cls = '', meme) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + cls;
  if (cls === 'system') {
    div.textContent = text;
  } else {
    const author = document.createElement('span');
    author.className = 'name';
    author.textContent = `${name}: `;
    div.append(author, document.createTextNode(text || ''));
    if (meme) {
      const image = document.createElement('img');
      image.src = meme.url;
      image.alt = meme.name;
      image.className = 'meme-image';
      image.referrerPolicy = 'no-referrer';
      image.addEventListener('error', () => image.replaceWith(meme.name), { once: true });
      div.append(image);
    }
  }
  const container = document.getElementById('chatMessages');
  container.appendChild(div);
  while (container.children.length > 60) container.firstElementChild.remove();
  container.scrollTop = container.scrollHeight;
}

function sendGuess() {
  const input = document.getElementById('guessInput');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('guess', text);
  input.value = '';
}

document.getElementById('guessInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendGuess();
});

socket.on('chatMessage', (data) => {
  addChatMsg(data.name, data.text, data.guess ? 'wrong' : '', data.meme);
});

const chatInput = document.getElementById('chatInput');
const chatPicker = document.getElementById('chatPicker');
const emojiToggle = document.getElementById('emojiToggle');
const memeToggle = document.getElementById('memeToggle');
const hintButton = document.getElementById('hintButton');
const hintText = document.getElementById('hintText');
const connectionStatus = document.getElementById('connectionStatus');
let pickerMode = '';
let memeCatalog;
let audio;
let musicTimer;

document.getElementById('chatForm').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = chatInput.value.trim();
  if (!text || !socket.connected) return;
  socket.emit('chat', text);
  chatInput.value = '';
});

function switchPicker(mode) {
  pickerMode = pickerMode === mode ? '' : mode;
  chatPicker.hidden = !pickerMode;
  chatPicker.replaceChildren();
  emojiToggle.setAttribute('aria-expanded', String(pickerMode === 'emoji'));
  memeToggle.setAttribute('aria-expanded', String(pickerMode === 'meme'));
  return pickerMode === mode;
}

function pickerButton(label, action) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'game-action';
  button.textContent = label;
  button.addEventListener('click', action);
  chatPicker.append(button);
  return button;
}

emojiToggle.addEventListener('click', () => {
  if (!switchPicker('emoji')) return;
  for (const emoji of ['😂', '😭', '🔥', '💀', '❤️', '👀', '🤔', '👏', '🎉', '🫠', '💅', '🤣']) {
    pickerButton(emoji, () => {
      const start = chatInput.selectionStart;
      const end = chatInput.selectionEnd;
      if (chatInput.value.length - (end - start) + emoji.length <= chatInput.maxLength) {
        chatInput.setRangeText(emoji, start, end, 'end');
      }
      chatInput.focus();
    });
  }
});

memeToggle.addEventListener('click', async () => {
  if (!switchPicker('meme')) return;
  chatPicker.textContent = 'Cargando memes…';
  try {
    if (!memeCatalog) {
      const response = await fetch('/api/memes');
      if (!response.ok) throw new Error('Catálogo no disponible');
      memeCatalog = await response.json();
    }
    if (pickerMode !== 'meme') return;
    chatPicker.replaceChildren();
    for (const meme of memeCatalog) {
      const button = pickerButton(meme.name, () => {
        if (!socket.connected) return;
        socket.emit('meme', meme.id);
        switchPicker('meme');
      });
      button.classList.add('meme-choice');
      const image = document.createElement('img');
      image.src = meme.url;
      image.alt = '';
      image.referrerPolicy = 'no-referrer';
      button.prepend(image);
    }
  } catch {
    if (pickerMode === 'meme') chatPicker.textContent = 'No se pudieron cargar los memes.';
  }
});

hintButton.addEventListener('click', () => {
  if (socket.connected) socket.emit('hint');
});
socket.on('hint', (clue) => {
  hintButton.disabled = true;
  hintText.textContent = clue;
  hintText.hidden = false;
});

socket.on('disconnect', () => {
  if (myRoomCode) connectionStatus.textContent = 'Reconectando…';
});
socket.on('connect', () => {
  if (myRoomCode && !socket.recovered) {
    myRoomCode = '';
    document.getElementById('roundOverlay').classList.remove('active');
    showScreen('lobby');
    showError('Se perdió la conexión con la sala. Crea otra o vuelve a entrar.');
  }
  connectionStatus.textContent = '';
});

function playTone(frequency, when, duration, volume) {
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(0.001, when);
  gain.gain.exponentialRampToValueAtTime(volume, when + 0.025);
  gain.gain.exponentialRampToValueAtTime(0.001, when + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(when);
  oscillator.stop(when + duration);
}

function playMelody(notes, spacing, volume) {
  const start = audio.currentTime;
  notes.forEach((note, index) => playTone(note, start + index * spacing, spacing, volume));
}

document.getElementById('musicToggle').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = undefined;
    await audio.suspend();
    button.setAttribute('aria-pressed', 'false');
    button.textContent = '🎵 Música';
    return;
  }
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  audio ||= new Audio();
  await audio.resume();
  const music = () => playMelody([262, 330, 392, 330, 294, 349, 440, 392], 0.35, 0.025);
  music();
  musicTimer = setInterval(music, 4200);
  button.setAttribute('aria-pressed', 'true');
  button.textContent = '🔇 Silenciar';
});

// --- Game events ---
socket.on('playerJoined', (data) => {
  showGameMenu();
  addChatMsg('', `🎮 ¡${data.players.join(' y ')} están listos!`, 'system');
});

socket.on('role', (data) => {
  myRole = data.role;
  const wordHint = document.getElementById('wordHint');
  const wordRole = document.getElementById('wordRole');
  const toolsBar = document.getElementById('toolsBar');
  const chatInputRow = document.getElementById('chatInputRow');
  hintText.hidden = true;
  hintButton.disabled = false;

  if (data.role === 'drawer') {
    wordRole.textContent = '✏️ TE TOCA DIBUJAR';
    wordHint.textContent = data.word.toUpperCase();
    toolsBar.classList.remove('tools-disabled');
    chatInputRow.hidden = true;
  } else {
    wordRole.textContent = '🔍 ADIVINA EL DIBUJO';
    // Show underscores as hint
    wordHint.textContent = '_ '.repeat(data.wordLength).trim();
    toolsBar.classList.add('tools-disabled');
    chatInputRow.hidden = false;
  }
});

socket.on('roundStart', (data) => {
  document.getElementById('roundBadge').textContent = `Ronda ${data.round}/${data.totalRounds}`;
  updateScores(data.scores, data.drawerName);
  addChatMsg('', `🎨 Ronda ${data.round} — ${data.drawerName} dibuja`, 'system');

  // Hide overlay
  document.getElementById('roundOverlay').classList.remove('active');

  document.getElementById('timerBadge').textContent = data.timeLeft;
  document.getElementById('timerBadge').classList.remove('urgent');
});

socket.on('timerUpdate', (time) => {
  const badge = document.getElementById('timerBadge');
  badge.textContent = time;
  badge.classList.toggle('urgent', time <= 10);
});

socket.on('roundEnd', (data) => {
  if (musicTimer && data.guessed) playMelody([392, 494, 587, 784], 0.12, 0.085);
  const overlay = document.getElementById('roundOverlay');
  const emoji = document.getElementById('overlayEmoji');
  const title = document.getElementById('overlayTitle');
  const word = document.getElementById('overlayWord');
  const scores = document.getElementById('overlayScores');

  if (data.guessed) {
    emoji.textContent = '🎉';
    title.textContent = `¡${data.guesserName} adivinó!`;
    title.className = 'overlay-title correct';
    word.textContent = `"${data.word.toUpperCase()}" — +${data.points} pts`;
  } else {
    emoji.textContent = '⏰';
    title.textContent = '¡Se acabó el tiempo!';
    title.className = 'overlay-title timeout';
    word.textContent = `La palabra era: "${data.word.toUpperCase()}"`;
  }

  scores.innerHTML = data.scores.map(s =>
    `<div class="overlay-score-item">
      <div class="overlay-score-name">${escapeHtml(s.name)}</div>
      <div class="overlay-score-pts">${s.score}</div>
    </div>`
  ).join('');

  overlay.classList.add('active');
});

socket.on('gameOver', (data) => {
  document.getElementById('roundOverlay').classList.remove('active');

  if (data.winner) {
    document.getElementById('winnerName').textContent = `🎉 ¡${data.winner} gana!`;
  } else {
    document.getElementById('winnerName').textContent = '🤝 ¡Empate!';
  }

  const container = document.getElementById('finalScores');
  const sorted = [...data.scores].sort((a, b) => b.score - a.score);
  container.innerHTML = sorted.map((s, i) =>
    `<div class="final-score-card${i === 0 && data.winner ? ' winner' : ''}">
      <div class="final-score-name">${i === 0 && data.winner ? '👑 ' : ''}${escapeHtml(s.name)}</div>
      <div class="final-score-pts">${s.score}</div>
    </div>`
  ).join('');

  showScreen('gameOver');
  launchConfetti();
});

socket.on('opponentLeft', () => {
  addChatMsg('', '😢 Tu oponente se desconectó', 'system');
  setTimeout(() => {
    alert('Tu oponente se fue. Volviendo al inicio...');
    location.reload();
  }, 2000);
});

function updateScores(scores, drawerName) {
  const container = document.getElementById('scoresMini');
  container.innerHTML = scores.map(s =>
    `<span class="score-pill${s.name === drawerName ? ' drawing' : ''}">${escapeHtml(s.name)}: ${s.score}</span>`
  ).join('');
}

function escapeHtml(text) {
  const element = document.createElement('span');
  element.textContent = text;
  return element.innerHTML;
}

// --- Confetti ---
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#ff6b35', '#ffd166', '#06d6a0', '#ef476f', '#118ab2', '#7b2ff7', '#e84393'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 6000);
}

// --- Resize handler ---
window.addEventListener('resize', () => {
  if (document.getElementById('game').classList.contains('active')) {
    resizeCanvas();
  }
});

// Enter key on code input
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') joinRoom();
});
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const joinVisible = !document.getElementById('joinSection').hidden;
    if (joinVisible) document.getElementById('codeInput').focus();
    else createRoom();
  }
});
</script>
<script src="/games.js"></script>
</body>
